name: Régénération de la base

on:
  push:
    branches: [main]
    paths: ["data/**", "tools/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/build_data.py
      - name: Commit de assets/data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data.json
          git diff --cached --quiet || (git commit -m "chore: régénère assets/data.json" && git push)
